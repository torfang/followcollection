<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0f0f12"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Pokémon Tracker FR</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0f12;--bg2:#17171d;--bg3:#1f1f28;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0f0f5;--text2:#888899;--text3:#444455;--red:#e83a4a;--red2:#ff6b7a;--green:#1db97a;--amber:#f5a623;--blue:#4a9eff;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;--r:14px;--r2:20px;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overscroll-behavior:none;}
body{display:flex;flex-direction:column;height:100dvh;}
.topbar{background:var(--bg2);border-bottom:.5px solid var(--border);padding:calc(var(--safe-top)+12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.02em;}
.topbar-sub{font-size:10px;color:var(--text2);margin-top:1px;font-family:var(--mono);}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--bg3);border:.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
.tabs{display:flex;border-bottom:.5px solid var(--border);background:var(--bg2);flex-shrink:0;}
.tab{flex:1;padding:10px 4px;font-size:11px;font-weight:500;color:var(--text2);background:none;border:none;cursor:pointer;font-family:var(--sans);position:relative;}
.tab.active{color:var(--red2);}
.tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--red);border-radius:2px 2px 0 0;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(var(--safe-bot)+80px);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:.5px solid var(--border);padding:8px 16px calc(var(--safe-bot)+6px);display:flex;justify-content:center;z-index:50;}
.fab{display:flex;align-items:center;gap:8px;background:var(--red);color:white;border:none;border-radius:24px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.fab:active{transform:scale(.97);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.sc{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:12px 14px;}
.sc-l{font-size:10px;color:var(--text2);font-family:var(--mono);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
.sc-v{font-size:21px;font-weight:600;font-family:var(--mono);}
.sc-s{font-size:10px;margin-top:2px;font-family:var(--mono);}
.up{color:var(--green);}.down{color:var(--red);}.neu{color:var(--text2);}
.search-wrap{position:relative;margin-bottom:8px;}
.search-inp{width:100%;background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--r);padding:10px 14px 10px 36px;font-size:14px;color:var(--text);font-family:var(--sans);outline:none;}
.search-inp::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
.filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;border:.5px solid var(--border2);background:var(--bg2);color:var(--text2);white-space:nowrap;cursor:pointer;font-family:var(--sans);}
.chip.active{background:var(--red);border-color:var(--red);color:white;}
.card-list{display:flex;flex-direction:column;gap:7px;}
.ci{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r2);padding:11px 13px;display:flex;align-items:center;gap:9px;cursor:pointer;}
.ci:active{background:var(--bg3);}
.ci.selected{border-color:var(--red);border-width:1px;}
.ct{width:36px;height:50px;border-radius:7px;background:var(--bg3);border:.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.ct img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-meta{font-size:10px;color:var(--text2);margin-top:2px;font-family:var(--mono);}
.badges{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;}
.bdg{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:600;font-family:var(--mono);}
.b-fr{background:rgba(74,158,255,.15);color:#4a9eff;border:.5px solid rgba(74,158,255,.3);}
.b-h{background:rgba(155,127,232,.15);color:#c4aaff;border:.5px solid rgba(155,127,232,.3);}
.b-psa{background:rgba(29,185,122,.15);color:#1db97a;border:.5px solid rgba(29,185,122,.3);}
.b-stale{background:rgba(232,58,74,.1);color:var(--red2);border:.5px solid rgba(232,58,74,.2);}
.ci-right{text-align:right;flex-shrink:0;min-width:70px;}
.pv{font-size:14px;font-weight:700;font-family:var(--mono);}
.pv-buy{font-size:9px;color:var(--text2);font-family:var(--mono);margin-top:1px;}
.pc{font-size:10px;margin-top:1px;font-family:var(--mono);}

/* DETAIL */
.detail-card{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r2);padding:13px;margin-bottom:10px;}
.detail-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
.detail-name{font-size:15px;font-weight:600;}
.detail-meta{font-size:10px;color:var(--text2);margin-top:2px;font-family:var(--mono);}
.prices-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.price-block{background:var(--bg3);border-radius:12px;padding:12px;border:.5px solid var(--border);}
.price-block-logo{font-size:10px;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.price-block-main{font-size:20px;font-weight:700;font-family:var(--mono);}
.price-block-sub{font-size:9px;color:var(--text2);margin-top:3px;font-family:var(--mono);}
.price-block-range{font-size:10px;color:var(--text2);margin-top:2px;font-family:var(--mono);}
.price-source-badge{font-size:8px;padding:1px 5px;border-radius:10px;font-weight:600;margin-left:4px;}
.badge-cm{background:rgba(29,185,122,.2);color:var(--green);}
.badge-ebay{background:rgba(245,166,35,.2);color:var(--amber);}
.badge-live{background:rgba(74,158,255,.2);color:var(--blue);}
.profit-block{background:var(--bg3);border-radius:10px;padding:10px 12px;border:.5px solid var(--border);margin-bottom:10px;}
.chart-wrap{position:relative;width:100%;height:100px;margin-bottom:8px;}
.detail-actions{display:flex;gap:6px;}
.act-btn{flex:1;padding:9px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--sans);border:.5px solid var(--border2);background:var(--bg3);color:var(--text2);}
.last-update{font-size:9px;color:var(--text2);font-family:var(--mono);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;}

/* PLANNING */
.info-box{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:11px 13px;font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:11px;}
.info-box strong{color:var(--text);font-weight:600;}
.batch-card{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:7px;}
.batch-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.batch-title{font-size:12px;font-weight:600;font-family:var(--mono);}
.batch-day{font-size:10px;color:var(--text2);font-family:var(--mono);}
.batch-cards{display:flex;flex-wrap:wrap;gap:4px;}
.batch-pill{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg3);border:.5px solid var(--border);color:var(--text2);font-family:var(--mono);}
.batch-pill.done{background:rgba(29,185,122,.1);border-color:rgba(29,185,122,.3);color:var(--green);}
.batch-pill.current{background:rgba(74,158,255,.1);border-color:rgba(74,158,255,.3);color:var(--blue);}
.run-btn{width:100%;padding:14px;border-radius:var(--r);background:var(--red);color:white;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:var(--sans);margin-bottom:8px;}
.run-btn:disabled{opacity:.4;cursor:not-allowed;}
.run-btn:active:not(:disabled){transform:scale(.98);}
.progress-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:11px;}
.progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .4s;}
.snap-btn{width:100%;padding:11px;border-radius:var(--r);background:var(--bg2);border:.5px solid var(--border2);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);}

/* HISTORY */
.hist-card{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r2);padding:11px 13px;margin-bottom:9px;}
.hist-card-name{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
.hist-table{width:100%;border-collapse:collapse;font-size:11px;font-family:var(--mono);}
.hist-table th{font-size:9px;color:var(--text2);text-align:left;padding:3px 4px;border-bottom:.5px solid var(--border);text-transform:uppercase;letter-spacing:.04em;}
.hist-table td{padding:5px 4px;border-bottom:.5px solid var(--border);}
.hist-table tr:last-child td{border-bottom:none;}
.no-snap{text-align:center;padding:40px 20px;font-size:13px;color:var(--text2);}
.empty-state{text-align:center;padding:40px 20px;}
.empty-emoji{font-size:44px;margin-bottom:10px;}
.empty-title{font-size:15px;font-weight:600;margin-bottom:5px;}
.empty-sub{font-size:12px;color:var(--text2);line-height:1.6;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg2);border:.5px solid var(--border2);border-radius:24px 24px 0 0;padding:20px 20px calc(var(--safe-bot)+20px);width:100%;max-height:92dvh;overflow-y:auto;}
.modal-handle{width:36px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.fg{margin-bottom:11px;}
.fl{font-size:10px;color:var(--text2);margin-bottom:4px;display:block;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;}
.fi{width:100%;background:var(--bg3);border:.5px solid var(--border2);border-radius:11px;padding:11px 13px;font-size:14px;color:var(--text);font-family:var(--sans);outline:none;}
.fi:focus{border-color:rgba(255,255,255,.25);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.mbtn-p{flex:1;padding:13px;border-radius:13px;background:var(--red);color:white;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:var(--sans);}
.mbtn-p:active{transform:scale(.98);}
.mbtn-s{flex:1;padding:13px;border-radius:13px;background:var(--bg3);border:.5px solid var(--border2);color:var(--text2);font-size:15px;cursor:pointer;font-family:var(--sans);}

/* SET BROWSER */
.set-search{width:100%;background:var(--bg3);border:.5px solid var(--border2);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--text);font-family:var(--sans);outline:none;margin-bottom:8px;}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:260px;overflow-y:auto;}
.set-item{background:var(--bg3);border:.5px solid var(--border);border-radius:10px;padding:9px 10px;cursor:pointer;text-align:center;}
.set-item:active{background:var(--bg2);}
.set-name{font-size:11px;font-weight:600;line-height:1.3;}
.set-meta{font-size:9px;color:var(--text2);margin-top:2px;font-family:var(--mono);}
.api-results{background:var(--bg3);border:.5px solid var(--border2);border-radius:11px;overflow:hidden;max-height:300px;overflow-y:auto;}
.api-result{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:.5px solid var(--border);}
.api-result:last-child{border-bottom:none;}
.api-result:active{background:var(--bg2);}
.api-result-img{width:32px;height:44px;border-radius:5px;object-fit:cover;background:var(--bg2);flex-shrink:0;}
.api-result-img-ph{width:32px;height:44px;border-radius:5px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.api-result-info{flex:1;min-width:0;}
.api-result-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.api-result-meta{font-size:10px;color:var(--text2);margin-top:2px;font-family:var(--mono);}
.api-result-price{font-size:11px;color:var(--green);font-family:var(--mono);margin-top:2px;}
.api-loading{padding:16px;text-align:center;font-size:12px;color:var(--text2);}
.selected-preview{background:var(--bg3);border:.5px solid var(--green);border-radius:11px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.selected-preview img{width:36px;height:50px;border-radius:6px;object-fit:cover;}
.selected-info{flex:1;min-width:0;}
.selected-name{font-size:13px;font-weight:600;}
.selected-meta{font-size:10px;color:var(--text2);margin-top:2px;font-family:var(--mono);}
.selected-prices{font-size:11px;margin-top:4px;font-family:var(--mono);}
.clear-btn{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:4px;}
.back-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;padding:4px 8px 4px 0;}

.toast{position:fixed;bottom:calc(var(--safe-bot)+80px);left:50%;transform:translateX(-50%);background:var(--bg3);border:.5px solid var(--border2);border-radius:24px;padding:10px 20px;font-size:13px;white-space:nowrap;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;}
.loading-logo{font-size:48px;margin-bottom:14px;animation:pulse 1.5s ease-in-out infinite;}
.loading-txt{font-family:var(--mono);font-size:13px;color:var(--text2);}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.spinner-inline{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">🎴</div>
  <div class="loading-txt">Chargement...</div>
</div>

<div class="topbar">
  <div>
    <div class="topbar-title">PKMN TRACKER FR</div>
    <div class="topbar-sub" id="hdrSub">—</div>
  </div>
  <div style="display:flex;gap:6px;">
    <div class="icon-btn" onclick="sw('planning')" title="Planning">📅</div>
    <div class="icon-btn" onclick="forceSnap()" title="Snapshot">💾</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="sw('collection',this)">Collection</button>
  <button class="tab" onclick="sw('planning',this)">Planning</button>
  <button class="tab" onclick="sw('historique',this)">Historique</button>
</div>

<div class="scroll" id="mainScroll">
  <div id="collectionView">
    <div style="height:10px;"></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div id="detailPanel"></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-inp" id="searchInp" placeholder="Nom, extension..." oninput="renderCards()"/>
    </div>
    <div class="filter-row">
      <div class="chip active" onclick="setFilter('',this)">Toutes</div>
      <div class="chip" onclick="setFilter('stale',this)">À actualiser</div>
      <div class="chip" onclick="setFilter('psa',this)">PSA</div>
      <div class="chip" onclick="setFilter('profit',this)">Plus-value</div>
    </div>
    <div class="card-list" id="cardList"></div>
    <div style="height:8px;"></div>
  </div>

  <div id="planningView" style="display:none;">
    <div style="height:10px;"></div>
    <div class="info-box"><strong>Stratégie :</strong> prix récupérés en direct via PokéTCG.io (CardMarket + eBay réels). Snapshots automatiques chaque semaine.</div>
    <div id="progressWrap" style="display:none;">
      <div style="font-size:11px;color:var(--text2);font-family:var(--mono);margin-bottom:5px;" id="batchLabel"></div>
      <div class="progress-bar"><div class="progress-fill" id="batchFill" style="width:0%"></div></div>
    </div>
    <button class="run-btn" id="runBtn" onclick="runNextBatch()">⚡ Actualiser les prix maintenant</button>
    <div id="queueContent"></div>
    <button class="snap-btn" onclick="forceSnap()">💾 Snapshot hebdomadaire maintenant</button>
    <div style="height:8px;"></div>
  </div>

  <div id="historiqueView" style="display:none;">
    <div style="height:10px;"></div>
    <div id="histContent"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="fab" onclick="openModal()">＋ Ajouter une carte</button>
</div>

<div id="toast" class="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Ajouter une carte</div>

    <!-- SELECTED PREVIEW -->
    <div id="selectedPreview" style="display:none;"></div>

    <!-- STEP 1: CHOOSE SET -->
    <div id="stepSet">
      <input class="set-search" id="setSearchInp" placeholder="🔍 Chercher une extension..." oninput="filterSets(this.value)"/>
      <div class="set-grid" id="setGrid"></div>
    </div>

    <!-- STEP 2: CHOOSE CARD -->
    <div id="stepCards" style="display:none;">
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:8px;">
        <button class="back-btn" onclick="backToSets()">←</button>
        <span id="setCardsTitle" style="font-size:13px;font-weight:600;"></span>
      </div>
      <input class="set-search" id="cardSearchInp" placeholder="🔍 Filtrer les cartes..." oninput="filterSetCards(this.value)"/>
      <div class="api-results" id="setCardsGrid"></div>
    </div>

    <!-- STEP 3: CONDITION + BUY PRICE -->
    <div id="stepCond" style="display:none;">
      <div class="frow">
        <div class="fg"><label class="fl">État</label>
          <select class="fi" id="condSel"><option>Near Mint</option><option>Lightly Played</option><option>PSA 10</option><option>PSA 9</option><option>PSA 8</option></select>
        </div>
        <div class="fg"><label class="fl">Prix achat (€)</label>
          <input class="fi" id="buyInp" placeholder="0.00" type="number" step="0.01"/>
        </div>
      </div>
    </div>

    <div class="modal-btns">
      <button class="mbtn-s" onclick="closeModal()">Annuler</button>
      <button class="mbtn-p" id="modalAddBtn" onclick="addCard()">Ajouter</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const CK='pkmn_v5_cards', SK='pkmn_v5_snaps', QK='pkmn_v5_quota', LRK='pkmn_v5_lr';
// Clé eBay — à remplir quand tu l'as
const EBAY_APP_ID = 'MarcDumo-followpo-PRD-78f86d25c-56435fea';
const POKE_API = 'https://api.pokemontcg.io/v2';
const BATCH = 15, MAX_BATCHES = 4;

let cards=[], snaps={}, quota={week:'',used:0}, lastRun=null;
let selCard=null, curTab='collection', filterMode='', chartInst=null;
let allSets=[], currentSetCards=[], selectedApiCard=null;

function wkKey(d){const dt=d||new Date(),y=dt.getFullYear(),s=new Date(y,0,1);return `${y}-W${String(Math.ceil(((dt-s)/864e5+s.getDay()+1)/7)).padStart(2,'0')}`;}
function daysToMonday(){const d=new Date().getDay();return d===1?7:(8-d)%7||7;}

const store={
  async get(k){try{if(window.storage)return window.storage.get(k);return{value:localStorage.getItem(k)};}catch(e){return{value:localStorage.getItem(k)};}},
  async set(k,v){try{if(window.storage)return window.storage.set(k,v);localStorage.setItem(k,v);}catch(e){localStorage.setItem(k,v);}}
};

async function load(){
  try{const r=await store.get(CK);if(r&&r.value)cards=JSON.parse(r.value);}catch(e){cards=[];}
  try{const r=await store.get(SK);if(r&&r.value)snaps=JSON.parse(r.value);}catch(e){snaps={};}
  try{
    const r=await store.get(QK);
    if(r&&r.value){quota=JSON.parse(r.value);if(quota.week!==wkKey()){quota={week:wkKey(),used:0};await saveQuota();}}
  }catch(e){quota={week:wkKey(),used:0};}
  try{const r=await store.get(LRK);if(r&&r.value)lastRun=JSON.parse(r.value);}catch(e){lastRun=null;}
  document.getElementById('loadingScreen').style.display='none';
  await checkAutoSnap();
  render();
  loadSets();
}

async function saveAll(){await store.set(CK,JSON.stringify(cards));await store.set(SK,JSON.stringify(snaps));}
async function saveQuota(){await store.set(QK,JSON.stringify(quota));}
async function saveLastRun(){await store.set(LRK,JSON.stringify(lastRun));}

async function checkAutoSnap(){

}

// ── PRIX RÉELS via PokéTCG.io ──
async function fetchRealPrices(card){
  if(!card.pokeTcgId)return null;
  try{
    const r=await fetch(`${POKE_API}/cards/${card.pokeTcgId}`);
    const d=await r.json();
    const c=d.data;
    if(!c)return null;
    const cm=c.cardmarket?.prices;
    const tcg=c.tcgplayer?.prices;
    const cmPrice=cm?.averageSellPrice||cm?.avg1||cm?.trendPrice||null;
    const tcgPrice=tcg?.holofoil?.market||tcg?.normal?.market||tcg?.['1stEditionHolofoil']?.market||null;

    // eBay si clé dispo
    let ebayPrice=null;
    if(EBAY_APP_ID){
      ebayPrice=await fetchEbayPrice(card);
    }

    return{
      cm: cmPrice ? Math.round(cmPrice*100)/100 : null,
      cm_low: cm?.lowPrice||null,
      cm_high: cm?.highPrice||null,
      cm_trend: cm?.trendPrice||null,
      tcg: tcgPrice ? Math.round(tcgPrice*92)/100 : null, // USD→EUR ~0.92
      ebay: ebayPrice,
      ts: Date.now(),
      at: new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
    };
  }catch(e){return null;}
}

async function fetchEbayPrice(card){
  if(!EBAY_APP_ID)return null;
  try{
    const q=encodeURIComponent(`${card.name} ${card.set} pokemon french`);
    const url=`https://svcs.ebay.com/services/search/FindingService/v1?OPERATION-NAME=findCompletedItems&SERVICE-VERSION=1.0.0&SECURITY-APPNAME=${EBAY_APP_ID}&RESPONSE-DATA-FORMAT=JSON&categoryId=183454&keywords=${q}&itemFilter(0).name=Condition&itemFilter(0).value=3000&sortOrder=EndTimeSoonest&paginationInput.entriesPerPage=10`;
    const r=await fetch(url);
    const d=await r.json();
    const items=d?.findCompletedItemsResponse?.[0]?.searchResult?.[0]?.item||[];
    if(!items.length)return null;
    const prices=items.map(i=>parseFloat(i.sellingStatus?.[0]?.currentPrice?.[0]?.['__value__']||0)).filter(p=>p>0);
    if(!prices.length)return null;
    const avg=prices.reduce((a,b)=>a+b,0)/prices.length;
    return Math.round(avg*100)/100;
  }catch(e){return null;}
}

// ── BATCH : actualise N cartes en parallèle ──
async function runNextBatch(){
  const btn=document.getElementById('runBtn');
  if(!cards.length){toast('Aucune carte.');return;}
  btn.disabled=true;btn.textContent='⏳ Récupération des prix...';
  document.getElementById('progressWrap').style.display='';
  const toUpdate=[...cards].filter(c=>c.pokeTcgId);
  const total=toUpdate.length;
  let done=0;
  document.getElementById('batchLabel').textContent=`0 / ${total} cartes actualisées`;
  document.getElementById('batchFill').style.width='5%';

  // Par batch de 5 en parallèle pour ne pas saturer
  const PARALLEL=5;
  for(let i=0;i<toUpdate.length;i+=PARALLEL){
    const chunk=toUpdate.slice(i,i+PARALLEL);
    await Promise.all(chunk.map(async card=>{
      const p=await fetchRealPrices(card);
      if(p)card.prices=p;
      done++;
      document.getElementById('batchLabel').textContent=`${done} / ${total} cartes actualisées`;
      document.getElementById('batchFill').style.width=Math.round(done/total*90+5)+'%';
    }));
  }

  document.getElementById('batchFill').style.width='100%';
  lastRun={week:wkKey(),ts:Date.now()};
  await saveAll();await saveLastRun();
  setTimeout(()=>{document.getElementById('progressWrap').style.display='none';btn.disabled=false;btn.textContent='⚡ Actualiser les prix maintenant';},700);
  render();
  toast(`${done} cartes actualisées — prix CardMarket réels !`);
  await checkAutoSnap();
}

async function forceSnap(silent=false){
  const wk=wkKey(),snap={};
  for(const c of cards){
    if(c.prices&&c.prices.cm){
      snap[c.id]={
        cm:c.prices.cm,
        ebay:c.prices.ebay||null,
        tcg:c.prices.tcg||null,
        date:new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})
      };
    }
  }
  if(!Object.keys(snap).length){if(!silent)toast('Aucun prix à sauvegarder.');return;}
  snaps[wk]=snap;
  await saveAll();
  if(!silent)toast('💾 Snapshot sauvegardé !');
}

// ── HELPERS ──
function cmPrice(c){return c.prices?.cm||null;}
function totalVal(){return Math.round(cards.reduce((s,c)=>s+(cmPrice(c)||0),0)*100)/100;}
function isStale(c){if(!c.prices||!c.prices.ts)return true;return(Date.now()-c.prices.ts)>7*24*3600*1000;}
function profit(c){const p=cmPrice(c);if(!p||!c.buyPrice)return null;return Math.round((p-c.buyPrice)*100)/100;}
function getCardWkData(cid){return Object.keys(snaps).sort().map(w=>({wk:w,wkL:w.replace('-W','·S'),cm:snaps[w][cid]?.cm||null,ebay:snaps[w][cid]?.ebay||null,date:snaps[w][cid]?.date||''})).filter(d=>d.cm!==null);}

        datasets:[{label:'CM €',data:wkData.map(d=>d.cm),borderColor:'#1db97a',backgroundColor:'rgba(29,185,122,0.08)',pointBackgroundColor:'#1db97a',pointRadius:3,tension:0.3,fill:true}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9},color:'#888899',autoSkip:false,maxRotation:0},grid:{display:false}},y:{ticks:{font:{size:9},color:'#888899',callback:v=>v+'€'},grid:{color:'rgba(255,255,255,0.04)'}}}}});
    },80);
  }
}

async function refreshOneCard(id){
  const card=cards.find(c=>c.id===id);if(!card||!card.pokeTcgId)return;
  toast('Actualisation...');
  const p=await fetchRealPrices(card);
  if(p){card.prices=p;await saveAll();render();toast('Prix mis à jour !');}
  else toast('Erreur de récupération.');
}

function renderPlanning(){
  document.getElementById('runBtn').textContent='⚡ Actualiser tous les prix maintenant';
  document.getElementById('runBtn').disabled=false;
  const staleCards=cards.filter(isStale);
  document.getElementById('queueContent').innerHTML=`
    <div style="background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:7px;">
      <div style="font-size:11px;color:var(--text2);font-family:var(--mono);margin-bottom:6px;">STATUT COLLECTION</div>
      <div style="font-size:13px;margin-bottom:4px;">✅ À jour : <strong>${cards.filter(c=>!isStale(c)&&c.prices).length}</strong> cartes</div>
      <div style="font-size:13px;margin-bottom:4px;">⏰ À actualiser : <strong>${staleCards.length}</strong> cartes</div>
      <div style="font-size:13px;">📊 Sans prix : <strong>${cards.filter(c=>!c.prices).length}</strong> cartes</div>
    </div>
    ${lastRun?`<div style="font-size:10px;color:var(--text2);font-family:var(--mono);margin-bottom:8px;">Dernière màj : ${new Date(lastRun.ts).toLocaleString('fr-FR')}</div>`:''}`;
}

function renderHistory(){
  const sorted=Object.keys(snaps).sort().reverse();
  if(!sorted.length){document.getElementById('histContent').innerHTML='<div class="no-snap"><div style="font-size:36px;margin-bottom:10px;">📊</div>Aucun snapshot encore.<br><span style="font-size:11px;">Snapshot automatique chaque semaine.</span></div>';return;}
  document.getElementById('histContent').innerHTML=cards.filter(c=>c.prices?.cm).map(card=>{
    const rows=sorted.map(wk=>{
      const s=snaps[wk]?.[card.id];if(!s||!s.cm)return'';
      const prevWk=sorted[sorted.indexOf(wk)+1];
      const prev=prevWk?snaps[prevWk]?.[card.id]?.cm:null;
      const chg=(prev&&s.cm&&prev>0)?((s.cm-prev)/prev*100).toFixed(1):null;
      return`<tr><td>${s.date||wk}</td><td style="font-weight:700;color:var(--green);">${s.cm.toFixed(2)}€</td><td>${s.ebay?s.ebay.toFixed(2)+'€':'—'}</td><td class="${chg>0?'up':chg<0?'down':'neu'}">${chg?(chg>0?'+':'')+chg+'%':'—'}</td></tr>`;
    }).filter(Boolean).join('');
    if(!rows)return'';
    return`<div class="hist-card"><div class="hist-card-name">${card.imgSmall?`<img src="${card.imgSmall}" style="width:20px;height:28px;border-radius:3px;object-fit:cover;">`:''}${card.name}</div><table class="hist-table"><thead><tr><th>Semaine</th><th>CardMarket</th><th>eBay</th><th>Évol.</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).filter(Boolean).join('')||'<div class="no-snap">Aucune donnée historique.</div>';
}

function render(){
  renderStats();
  if(curTab==='collection'){renderCards();renderDetail();}
  else if(curTab==='planning')renderPlanning();
  else if(curTab==='historique')renderHistory();
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
load();
</script>
</body>
</html>
